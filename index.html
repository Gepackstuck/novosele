<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новоселье 22.11.2006 — приглашение</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font:14px Tahoma,'Trebuchet MS',Verdana,sans-serif;color:#000;background:linear-gradient(180deg,#3a7be0 0%,#8fc3ff 50%,#cfe8ff 100%);padding:18px 10px 64px;position:relative;overflow-x:hidden}
.hill{position:fixed;left:-20%;right:-20%;bottom:30px;height:34vh;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#5fbf3a,#2f8a1c);z-index:0}
.cloud{position:fixed;background:#fff;border-radius:20px;opacity:.85;z-index:0}
.win{position:relative;z-index:1;max-width:560px;margin:0 auto;border:3px solid #0a3fb3;border-radius:9px 9px 0 0;background:#ece9d8;box-shadow:6px 8px 0 rgba(0,0,0,.28)}
.title{height:32px;background:linear-gradient(180deg,#3d95ff 0%,#0a5bdc 45%,#0a4fc8 100%);display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;color:#fff;font-weight:700;font-size:14px;border-radius:6px 6px 0 0}
.title span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:3px;flex:none}.ctl i{width:22px;height:22px;background:#2a6be8;border:1px solid #fff;border-radius:3px;display:block}.ctl i:last-child{background:#e2461f}
.menu{display:flex;gap:14px;padding:3px 10px;border-bottom:1px solid #aca899;font-size:13px}
.body{padding:12px}
.hello{display:flex;gap:12px;align-items:center;background:#fff;border:2px inset #9a9a9a;padding:10px 12px;margin-bottom:10px;line-height:1.35}
.hello svg{flex:none}
.hello b{color:#0033cc}
fieldset{border:1px solid #aca899;border-radius:3px;margin:0 0 10px;padding:8px 10px 10px;box-shadow:inset 1px 1px 0 #fff}
legend{color:#0046d5;padding:0 4px;font-size:14px}
label.row{display:block;margin:6px 0 2px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:15px;padding:5px 6px;border:2px inset #9a9a9a;background:#fff;color:#000;border-radius:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #2a6be8;outline-offset:0}
.opt{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
.opt input{width:18px;height:18px;flex:none;accent-color:#2a6be8}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.btn{min-width:110px;min-height:34px;font:inherit;font-size:15px;color:#000;background:linear-gradient(180deg,#fff,#e4e1d0);border:2px solid #003c74;border-radius:4px;cursor:pointer;padding:4px 12px}
.btn.def{border-color:#2a6be8;box-shadow:inset 0 0 0 1px #8fb7ff;font-weight:700}
.btn:disabled{color:#6b6b6b;border-color:#b5b2a2;cursor:default}
.status{display:flex;justify-content:space-between;border-top:1px solid #aca899;padding:3px 10px;font-size:12px;color:#333}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.task{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:5;background:linear-gradient(180deg,#2a6be8,#1a4fc0);display:flex;align-items:center;justify-content:space-between}
.start{height:34px;padding:0 22px 0 16px;background:linear-gradient(180deg,#4cc22b,#2a8a14);border-radius:0 16px 16px 0;color:#fff;font-size:18px;font-weight:700;font-style:italic;display:flex;align-items:center}
.clock{padding:0 14px;color:#fff;font-size:14px}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}
.dlg{width:100%;max-width:380px;border:3px solid #0a3fb3;border-radius:9px 9px 0 0;background:#ece9d8;box-shadow:6px 8px 0 rgba(0,0,0,.35)}
.dlg .title{height:28px}
.dlg .in{display:flex;gap:14px;align-items:center;padding:16px 14px;font-size:16px;line-height:1.35}
.dlg .bt{padding:0 14px 14px;display:flex;justify-content:center}
</style>
</head>
<body>
<div class="hill" aria-hidden="true"></div>
<div class="cloud" aria-hidden="true" style="left:6%;top:30px;width:120px;height:34px"></div>
<div class="cloud" aria-hidden="true" style="right:8%;top:90px;width:90px;height:28px"></div>

<main class="win">
<div class="title"><span class="t">Приглашение на новоселье — анкета гостя</span><span class="ctl" aria-hidden="true"><i></i><i></i><i></i></span></div>
<div class="menu" aria-hidden="true"><span>Файл</span><span>Правка</span><span>Вид</span><span>Справка</span></div>
<div class="body">
<div class="hello">
<svg aria-hidden="true" viewBox="0 0 48 48" width="44" height="44"><circle cx="24" cy="24" r="22" fill="#2a6be8" stroke="#fff" stroke-width="3"/><text x="24" y="33" text-anchor="middle" font-size="30" font-weight="700" fill="#fff" font-family="Tahoma,Verdana,sans-serif">?</text></svg>
<div><b>Вы приглашены на новоселье!</b><br>22 ноября 2006 года, в 15:00 (или в 16:00, как получится).<br>Адрес: <b data-cfg="address">[АДРЕС НОВОЙ ХАТЫ]</b></div>
</div>

<form id="f" novalidate>
<div class="hp" aria-hidden="true"><label>Не заполняйте <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

<fieldset><legend>Данные гостя</legend>
<label class="row" for="name">Имя, фамилия, погоняло:</label>
<input id="name" name="name" type="text" required autocomplete="name">
<label class="row" for="contact">Как с вами связаться (телефон или ник):</label>
<input id="contact" name="contact" type="text" autocomplete="tel">
</fieldset>

<fieldset><legend>Придёте на новоселье?</legend>
<label class="opt"><input type="radio" name="coming" value="да">да</label>
<label class="opt"><input type="radio" name="coming" value="конечно да">конечно да</label>
<label class="opt"><input type="radio" name="coming" value="да, но в 16:00">да, но в 16:00</label>
<label class="opt"><input type="radio" name="coming" value="не смогу">не смогу (неуважительные причины не принимаются)</label>
<label class="row" for="plus">Сколько человек с вами (кроме вас):</label>
<input id="plus" name="plus" type="number" min="0" max="5" value="0" inputmode="numeric" style="max-width:100px">
</fieldset>

<fieldset><legend>Что принесёте с собой</legend>
<label class="opt"><input type="checkbox" name="bring" value="семки">семки</label>
<label class="opt"><input type="checkbox" name="bring" value="хорошее настроение">хорошее настроение</label>
<label class="opt"><input type="checkbox" name="bring" value="шлёпки с носками">шлёпки с носками (обязательно)</label>
<label class="row" for="hero">Любимый герой:</label>
<select id="hero" name="hero"><option value="">— выберите —</option><option>Башка</option><option>Ржавый</option><option>бабушка из подъезда</option></select>
</fieldset>

<fieldset><legend>Пожелания</legend>
<label class="row" for="note">Аллергии, пожелания, что-то ещё:</label>
<textarea id="note" name="note"></textarea>
</fieldset>

<div class="btns"><button class="btn def" id="send" type="submit">Отправить</button><button class="btn" type="reset">Отмена</button></div>
</form>
</div>
<div class="status"><span id="st">Готово</span><span>Маме не показывать!</span></div>
</main>

<div class="task"><div class="start">пуск</div><div class="clock">15:00</div></div>

<div class="ov" id="ov" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dm">
<div class="dlg"><div class="title"><span class="t" id="dt">Сообщение</span></div>
<div class="in"><svg id="di" aria-hidden="true" viewBox="0 0 48 48" width="44" height="44"></svg><div id="dm"></div></div>
<div class="bt"><button class="btn def" id="ok" type="button">ОК</button></div></div></div>

<script>
// ===== НАСТРОЙКИ (меняйте здесь) =====
var CONFIG = {
  // Адрес веб-приложения Google Apps Script (см. README.md, шаг 3). Пока пусто — «пробный» режим без отправки.
  endpoint: "https://script.google.com/macros/s/AKfycby3B5b9zBBTLxmHX80uWI7jrYb2OePk4yQjzCM83qKU-4rRD8axhlU5khN0BHQn1KoXHA/exec",
  address: "[АДРЕС НОВОЙ ХАТЫ]"
};
// =====================================
document.querySelectorAll('[data-cfg="address"]').forEach(function(e){ e.textContent = CONFIG.address; });
var f=document.getElementById('f'), btn=document.getElementById('send'), st=document.getElementById('st');
var ov=document.getElementById('ov'), dt=document.getElementById('dt'), dm=document.getElementById('dm'), di=document.getElementById('di');
var ICON={
  ok:'<circle cx="24" cy="24" r="22" fill="#2a6be8" stroke="#fff" stroke-width="3"/><path d="M13 25l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
  err:'<circle cx="24" cy="24" r="22" fill="#e2461f" stroke="#fff" stroke-width="3"/><path d="M15 15l18 18M33 15L15 33" stroke="#fff" stroke-width="5" stroke-linecap="round"/>'
};
function dlg(kind,title,text){ dt.textContent=title; dm.textContent=text; di.innerHTML=ICON[kind]; ov.classList.add('on'); document.getElementById('ok').focus(); }
document.getElementById('ok').onclick=function(){ ov.classList.remove('on'); };
f.addEventListener('submit',function(ev){
  ev.preventDefault();
  var d=new FormData(f);
  if(d.get('website')) return;                       // ловушка для спам-ботов
  if(!String(d.get('name')||'').trim()){ dlg('err','Ошибка','Напишите, как вас зовут!'); return; }
  if(!d.get('coming')){ dlg('err','Ошибка','Ответьте, придёте ли вы на новоселье!'); return; }
  var body=new URLSearchParams();
  body.append('name',d.get('name').trim());
  body.append('coming',d.get('coming'));
  body.append('plus',d.get('plus')||'0');
  body.append('bring',d.getAll('bring').join(', '));
  body.append('hero',d.get('hero')||'');
  body.append('contact',d.get('contact')||'');
  body.append('note',d.get('note')||'');
  btn.disabled=true; st.textContent='Отправка…';
  if(!CONFIG.endpoint){ setTimeout(function(){ dlg('err','Пробный режим','Адрес таблицы ещё не подключён, данные никуда не ушли.'); btn.disabled=false; st.textContent='Готово'; },400); return; }
  fetch(CONFIG.endpoint,{method:'POST',mode:'no-cors',body:body})
    .then(function(){ dlg('ok','Анкета принята','Анкета принята! Ё маё, ждём вас 22 ноября!!!'); f.reset(); btn.disabled=false; st.textContent='Готово'; })
    .catch(function(){ dlg('err','Ошибка','Не отправилось. Попробуйте ещё раз или напишите напрямую.'); btn.disabled=false; st.textContent='Готово'; });
});
</script>
</body>
</html>
